name: Release

# 推送 v* 标签（如 v1.0.0）时：类型检查 → 构建 → 打包 dist/ → 上传 GitHub Release
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Package extension
        run: |
          cd dist
          zip -r "../json-visualizer-${GITHUB_REF_NAME}.zip" .

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: json-visualizer-*.zip
          generate_release_notes: true
